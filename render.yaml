services:
  # Backend FastAPI Service
  - type: web
    name: forklift-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12 # Ensure Render uses a compatible Python version
      # Add your MongoDB connection string here if it's dynamic
      # - key: MONGO_URI
      #   sync: false

  # Frontend Next.js Service
  - type: web
    name: forklift-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: forklift-backend
          envVarKey: RENDER_EXTERNAL_URL
